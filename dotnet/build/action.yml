name: .NET Build
description: Restore, check formatting, build and test with Microsoft Testing Platform.
inputs:
  prepare:
    description: Optional repository-relative Python preparation script, run after SDK setup.
    default: ''
  directory:
    description: Directory containing the solution and its test configuration.
    default: src
  version:
    description: Optional stable release version used when restoring and building.
    default: ''
  test-filter:
    description: Optional NUnit/MSTest filter expression for Microsoft Testing Platform.
    default: ''
  coverage:
    description: Collect Cobertura coverage and generate a job summary.
    default: 'true'
  coverage-assembly-filters:
    description: Semicolon-separated +include/-exclude library globs. Test libraries are always excluded.
    default: +*
  coverage-file-filters:
    description: Semicolon-separated +include/-exclude source path globs. Test files are always excluded.
    default: +*
  test-report:
    description: Generate test summaries. Requires Microsoft.Testing.Extensions.TrxReport in every test project.
    default: 'true'
  dotnet-version:
    description: .NET SDK version to install.
    default: 10.0.x
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
    - name: Build and test
      shell: python
      env:
        BUILD_SCRIPT: ${{ github.action_path }}/../../scripts/build.py
        BUILD_DIRECTORY: ${{ inputs.directory }}
        PREPARE_SCRIPT: ${{ inputs.prepare }}
        VERSION: ${{ inputs.version }}
        TEST_FILTER: ${{ inputs.test-filter }}
        COVERAGE: ${{ inputs.coverage }}
        COVERAGE_ASSEMBLY_FILTERS: ${{ inputs.coverage-assembly-filters }}
        COVERAGE_FILE_FILTERS: ${{ inputs.coverage-file-filters }}
        TEST_REPORT: ${{ inputs.test-report }}
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["BUILD_SCRIPT"], 'build']
        runpy.run_path(sys.argv[0], run_name="__main__")
