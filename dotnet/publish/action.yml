name: NuGet Publish
description: Push already prepared packages to nuget.org, without checkout or rebuilding.
inputs:
  directory:
    description: Directory containing the validated .nupkg and .snupkg artifacts.
    default: artifacts/packages
  nuget-user:
    description: NuGet profile name for trusted publishing (requires id-token write permission).
    required: true
runs:
  using: composite
  steps:
    - name: Validate publication inputs
      shell: python
      env:
        NUGET_USER: ${{ inputs.nuget-user }}
        PACKAGE_DIRECTORY: ${{ inputs.directory }}
      run: |
        import os
        from pathlib import Path
        assert os.environ["NUGET_USER"], "Provide nuget-user for trusted publishing."
        assert list(Path(os.environ["PACKAGE_DIRECTORY"]).glob("*.nupkg")), "No prepared .nupkg files found."
    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: ${{ inputs.nuget-user }}
    - name: Push prepared packages
      shell: python
      env:
        PACKAGE_DIRECTORY: ${{ inputs.directory }}
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        BUILD_SCRIPT: ${{ github.action_path }}/../../scripts/build.py
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["BUILD_SCRIPT"], 'publish']
        runpy.run_path(sys.argv[0], run_name="__main__")
