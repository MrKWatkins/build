name: Create Release
description: Tag an explicit commit and create its GitHub release.
inputs:
  version:
    description: Stable release version without a v prefix.
    required: true
  commit:
    description: Full resolved SHA of the commit that was built and validated.
    required: true
runs:
  using: composite
  steps:
    - name: Create tag and release
      shell: python
      env:
        VERSION: ${{ inputs.version }}
        COMMIT: ${{ inputs.commit }}
        GH_TOKEN: ${{ github.token }}
        BUILD_SCRIPT: ${{ github.action_path }}/../../scripts/build.py
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["BUILD_SCRIPT"], 'create-release']
        runpy.run_path(sys.argv[0], run_name="__main__")
