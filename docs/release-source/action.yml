name: Resolve documentation API source
description: Resolve the latest released version and the API source commit when Release publishes documentation without packages.
inputs:
  api-ref:
    description: Optional API source override for XML documentation corrections
outputs:
  version:
    description: Latest released library version without the v prefix
    value: ${{ steps.resolve.outputs.version }}
  commit:
    description: Resolved API source commit SHA
    value: ${{ steps.resolve.outputs.commit }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: python
      env:
        API_REF: ${{ inputs.api-ref }}
        GH_TOKEN: ${{ github.token }}
        BUILD_SCRIPT: ${{ github.action_path }}/../../scripts/build.py
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["BUILD_SCRIPT"], 'release-source']
        runpy.run_path(sys.argv[0], run_name="__main__")
