name: Resolve documentation API source
description: Resolve the latest released version and the API source commit for a docs-only build.
inputs:
  api-ref:
    description: Optional API source override for XML documentation corrections
outputs:
  version:
    description: Latest released library version without the v prefix
    value: ${{ steps.resolve.outputs.version }}
  commit:
    description: Resolved API source commit SHA
    value: ${{ steps.resolve.outputs.commit }}
  release-tag:
    description: Latest stable release tag
    value: ${{ steps.resolve.outputs.release-tag }}
runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        RESOLVE_SCRIPT: ${{ github.action_path }}/resolve.sh
        API_REF: ${{ inputs.api-ref }}
        GH_TOKEN: ${{ github.token }}
      run: bash "$RESOLVE_SCRIPT"
