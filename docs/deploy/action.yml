name: Deploy documentation
description: Deploy the validated Pages artifact only if it describes the latest release.
inputs:
  version:
    description: Released library version displayed by the site
    required: true
  artifact-name:
    description: Uploaded Pages artifact name
    default: github-pages
outputs:
  page-url:
    description: Deployed site URL
    value: ${{ steps.deploy.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Check release freshness
      shell: python
      env:
        VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ github.token }}
        BUILD_SCRIPT: ${{ github.action_path }}/../../scripts/build.py
      run: |
        import os, runpy, sys
        sys.argv = [os.environ["BUILD_SCRIPT"], 'freshness']
        runpy.run_path(sys.argv[0], run_name="__main__")
    - id: deploy
      uses: actions/deploy-pages@v5
      with:
        artifact_name: ${{ inputs.artifact-name }}
