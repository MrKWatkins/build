StylesPath = styles
MinAlertLevel = error
Vocab = Shared

[*.md]
BasedOnStyles = Vale, write-good, Microsoft, Shared

# The shared spelling rule uses a British dictionary instead of Vale's US one.
Vale.Spelling = NO
Vale.Terms = warning
write-good.E-Prime = NO

# Generated anchors and technical identifiers are not prose.
TokenIgnores = (\{\s*#[^}]+\}), (\b[A-Z][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)+\b)
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.Spacing = NO
Microsoft.Acronyms = NO
Microsoft.Semicolon = NO

# British punctuation and established technical-prose conventions.
Microsoft.Quotes = NO
Microsoft.Dashes = NO
Microsoft.OxfordComma = NO
Microsoft.Contractions = NO
Microsoft.Passive = NO
Microsoft.Vocab = NO
