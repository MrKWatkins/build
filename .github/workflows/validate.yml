name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check shell scripts
        run: shellcheck -x -P SCRIPTDIR dotnet/*/*.sh release/create/*.sh scripts/*.sh tests/*.sh docs/scripts/*.sh images/*.sh
      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Test build and publication boundaries
        run: bash tests/test.sh
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build base image
        run: docker build -f images/docs-base/Dockerfile -t docs-base:local .
      - name: Build .NET image
        run: docker build -f images/docs-dotnet/Dockerfile -t docs-dotnet:local .
      - name: Test documentation toolchain
        run: bash tests/docs.sh
