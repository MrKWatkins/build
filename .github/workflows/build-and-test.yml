name: Build and Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Check shell scripts
        run: shellcheck -x -P SCRIPTDIR dotnet/*/*.sh release/create/*.sh scripts/*.sh tests/*.sh docs/scripts/*.sh images/*.sh
      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Test build and publication boundaries
        run: bash tests/test.sh
      - name: Test image publication boundaries
        run: bash tests/images.sh
      - name: Build and test documentation images
        env:
          IMAGE_VERSION: sha-${{ github.sha }}
        run: bash images/build.sh
      - name: Save tested images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output "$RUNNER_TEMP/documentation-images.tar" docs-base:local docs-dotnet:local
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: documentation-images
          path: ${{ runner.temp }}/documentation-images.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: documentation-images
          path: ${{ runner.temp }}/documentation-images
      - name: Load tested images
        run: docker load --input "$RUNNER_TEMP/documentation-images/documentation-images.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        env:
          IMAGE_VERSION: sha-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash images/publish.sh
