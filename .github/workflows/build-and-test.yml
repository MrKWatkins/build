name: Build and Test
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-and-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Check Python
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Check workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Test build and publication boundaries
        run: uv run --frozen pytest --run-dotnet
      - name: Build and test documentation images
        env:
          IMAGE_VERSION: sha-${{ github.sha }}
        run: uv run --frozen python scripts/build.py build-images
      - name: Save tested images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: docker save --output "$RUNNER_TEMP/documentation-images.tar" docs-base:local docs-dotnet:local
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: documentation-images
          path: ${{ runner.temp }}/documentation-images.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: documentation-images
          path: ${{ runner.temp }}/documentation-images
      - name: Load tested images
        run: docker load --input "$RUNNER_TEMP/documentation-images/documentation-images.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        env:
          IMAGE_VERSION: sha-${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build.py publish-images
